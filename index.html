<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алкобух - калькулятор расходов на вечеринку</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Стили остаются без изменений */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(20, 20, 20, 0.8);
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e0b354, #2c3e50, #e0b354);
        }
        
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .beer-icon {
            font-size: 2.8rem;
            color: #e0b354;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        h1 {
            font-size: 3.2rem;
            margin-bottom: 10px;
            color: #e0b354;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.4rem;
            color: #ddd;
            margin-bottom: 20px;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 14px 28px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        
        button:hover, button:active {
            background: #1a252f;
            transform: translateY(-3px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
        }
        
        .people-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .person-card {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid #444;
        }
        
        .person-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: #e0b354;
        }
        
        .person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .person-name {
            font-weight: bold;
            background: transparent;
            border: 1px solid transparent;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            color: #e0b354;
            font-size: 18px;
            font-weight: 600;
            -webkit-appearance: none;
        }
        
        .person-name:focus {
            border: 1px solid #e0b354;
            outline: none;
            background: rgba(224, 179, 84, 0.1);
        }
        
        .remove-btn {
            background: #c0392b;
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 6px;
            position: absolute;
            top: -10px;
            right: -10px;
            width: auto;
        }
        
        .remove-btn:hover, .remove-btn:active {
            background: #a93226;
            transform: scale(1.1);
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .input-group label {
            font-weight: 600;
            color: #e0b354;
            font-size: 15px;
        }
        
        input[type="number"] {
            padding: 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 100%;
            font-size: 16px;
            transition: border-color 0.3s;
            -webkit-appearance: none;
        }
        
        input[type="number"]:focus {
            border-color: #e0b354;
            outline: none;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #e0b354;
        }
        
        .checkbox-container label {
            font-weight: 600;
            color: #e0b354;
        }
        
        .results {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
        }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .summary-card {
            background: rgba(40, 40, 40, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #555;
            transition: transform 0.3s;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
            border-color: #e0b354;
        }
        
        .summary-card h3 {
            margin-bottom: 15px;
            color: #e0b354;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .summary-card p {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .transfers {
            margin-top: 30px;
        }
        
        .transfers h3 {
            margin-bottom: 20px;
            color: #e0b354;
            text-align: center;
            font-size: 1.8rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .transfer-item {
            background: rgba(40, 40, 40, 0.8);
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            border-left: 4px solid #e0b354;
            transition: transform 0.3s;
        }
        
        .transfer-item:hover {
            transform: translateX(5px);
            background: rgba(50, 50, 50, 0.9);
        }
        
        .empty-card {
            background: rgba(30, 30, 30, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            border: 2px dashed #555;
            border-radius: 12px;
            font-style: italic;
            color: #888;
        }
        
        @media (max-width: 1024px) {
            .people-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .people-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .summary {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .people-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .beer-icon {
                font-size: 2.2rem;
            }
            
            button {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Специфичные стили для iOS */
        @supports (-webkit-touch-callout: none) {
            input, button {
                font-size: 16px; /* Предотвращает масштабирование в iOS */
            }
            
            button {
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-beer beer-icon"></i>
                <h1>Алкобух</h1>
                <i class="fas fa-beer beer-icon"></i>
            </div>
            <p class="subtitle">Калькулятор расходов на вечеринку</p>
        </header>
        
        <div class="controls">
            <button id="add-person">
                <i class="fas fa-user-plus"></i> Добавить человека
            </button>
            <button id="calculate">
                <i class="fas fa-calculator"></i> Рассчитать
            </button>
        </div>
        
        <div class="people-grid" id="people-container">
            <!-- Карточки людей будут добавляться здесь -->
        </div>
        
        <div class="results" id="results" style="display: none;">
            <div class="summary">
                <div class="summary-card">
                    <h3>Общая сумма пьянки</h3>
                    <p id="total-spent">0 ₽</p>
                </div>
                <div class="summary-card">
                    <h3>Средняя еда и прочее на человека</h3>
                    <p id="average-food">0 ₽</p>
                </div>
                <div class="summary-card">
                    <h3>Средний алкоголь на пьющего</h3>
                    <p id="average-alcohol">0 ₽</p>
                </div>
                <div class="summary-card">
                    <h3>Участвовало в алкоголе</h3>
                    <p id="alcohol-participants">0</p>
                </div>
            </div>
            
            <div class="transfers">
                <h3>Переводы для выравнивания расходов</h3>
                <div id="transfers-list">
                    <!-- Список переводов будет здесь -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Переписываем код с учетом особенностей iOS
        document.addEventListener('DOMContentLoaded', function() {
            var peopleContainer = document.getElementById('people-container');
            var addPersonBtn = document.getElementById('add-person');
            var calculateBtn = document.getElementById('calculate');
            var resultsDiv = document.getElementById('results');
            var totalSpentEl = document.getElementById('total-spent');
            var averageFoodEl = document.getElementById('average-food');
            var averageAlcoholEl = document.getElementById('average-alcohol');
            var alcoholParticipantsEl = document.getElementById('alcohol-participants');
            var transfersList = document.getElementById('transfers-list');
            
            var peopleCount = 0;
            var maxPeople = 10;
            var defaultNames = ['Эдуард', 'Игорян', 'Колян', 'Диман', 'Антон П', 'Антон К', 'Вова', 'Ярослав'];
            
            // Добавляем участников по умолчанию
            for (var i = 0; i < defaultNames.length; i++) {
                addPerson(defaultNames[i]);
            }
            
            // Используем touchstart для iOS вместо click
            addPersonBtn.addEventListener('click', function() { addPerson(); });
            calculateBtn.addEventListener('click', calculate);
            
            // Также добавляем touchstart для лучшей совместимости с iOS
            addPersonBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                addPerson();
            });
            
            calculateBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                calculate();
            });
            
            function addPerson(name) {
                if (peopleCount >= maxPeople) {
                    alert('Максимум ' + maxPeople + ' человек');
                    return;
                }
                
                peopleCount++;
                var personId = peopleCount;
                var personName = name || 'Человек ' + personId;
                
                var personCard = document.createElement('div');
                personCard.className = 'person-card';
                personCard.innerHTML = `
                    <div class="input-group">
                        <label>Имя участника:</label>
                        <input type="text" class="person-name" value="${personName}" data-id="${personId}" placeholder="Введите имя">
                    </div>
                    <div class="input-group">
                        <label>Алкоголь (₽):</label>
                        <input type="number" min="0" class="alcohol" value="0" data-id="${personId}">
                    </div>
                    <div class="input-group">
                        <label>Еда и прочее (₽):</label>
                        <input type="number" min="0" class="food" value="0" data-id="${personId}">
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" class="drank-alcohol" data-id="${personId}">
                        <label>Участвовал в алкоголе</label>
                    </div>
                    <button class="remove-btn" data-id="${personId}">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                `;
                
                peopleContainer.appendChild(personCard);
                
                // Добавляем обработчик для кнопки удаления
                var removeBtn = personCard.querySelector('.remove-btn');
                removeBtn.addEventListener('click', function() {
                    if (confirm("Удалить этого участника?")) {
                        peopleContainer.removeChild(personCard);
                        peopleCount--;
                    }
                });
                
                // Также добавляем touchstart для iOS
                removeBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (confirm("Удалить этого участника?")) {
                        peopleContainer.removeChild(personCard);
                        peopleCount--;
                    }
                });
            }
            
            function calculate() {
                // Собираем данные о людях
                var people = [];
                var personCards = document.querySelectorAll('.person-card');
                
                if (personCards.length === 0) {
                    alert('Добавьте хотя бы одного человека');
                    return;
                }
                
                for (var i = 0; i < personCards.length; i++) {
                    var card = personCards[i];
                    var nameInput = card.querySelector('.person-name');
                    var alcoholInput = card.querySelector('.alcohol');
                    var foodInput = card.querySelector('.food');
                    var drankCheckbox = card.querySelector('.drank-alcohol');
                    
                    var person = {
                        id: alcoholInput.getAttribute('data-id'),
                        name: nameInput.value || 'Человек ' + alcoholInput.getAttribute('data-id'),
                        alcohol: parseFloat(alcoholInput.value) || 0,
                        food: parseFloat(foodInput.value) || 0,
                        drank: drankCheckbox.checked
                    };
                    
                    people.push(person);
                }
                
                // Рассчитываем общие суммы
                var totalAlcohol = 0;
                var totalFood = 0;
                
                for (var i = 0; i < people.length; i++) {
                    totalAlcohol += people[i].alcohol;
                    totalFood += people[i].food;
                }
                
                var totalSpent = totalAlcohol + totalFood;
                
                // Определяем, кто пил алкоголь
                var drinkers = [];
                for (var i = 0; i < people.length; i++) {
                    if (people[i].drank) {
                        drinkers.push(people[i]);
                    }
                }
                
                var alcoholParticipants = drinkers.length;
                
                // Рассчитываем, сколько каждый должен заплатить
                var alcoholPerDrinker = alcoholParticipants > 0 ? totalAlcohol / alcoholParticipants : 0;
                var foodPerPerson = totalFood / people.length;
                var totalPerPerson = foodPerPerson + (alcoholPerDrinker || 0);
                
                // Определяем, кто сколько потратил и кто кому должен
                var balances = [];
                for (var i = 0; i < people.length; i++) {
                    var person = people[i];
                    var shouldPay = person.drank ? totalPerPerson : foodPerPerson;
                    var actuallyPaid = person.alcohol + person.food;
                    
                    balances.push({
                        id: person.id,
                        name: person.name,
                        balance: actuallyPaid - shouldPay
                    });
                }
                
                // Сортируем по балансу (от наибольшего кредитора к наибольшему дебитору)
                balances.sort(function(a, b) {
                    return b.balance - a.balance;
                });
                
                // Рассчитываем переводы
                var transfers = [];
                var i = 0;
                var j = balances.length - 1;
                
                while (i < j) {
                    var creditor = balances[i];
                    var debtor = balances[j];
                    
                    // Если у кредитора нет денег для получения или у дебитора нет долга - выходим
                    if (creditor.balance <= 0 || debtor.balance >= 0) break;
                    
                    var amountToTransfer = Math.min(creditor.balance, -debtor.balance);
                    
                    if (amountToTransfer > 0.01) { // Игнорируем переводы меньше 1 копейки
                        transfers.push({
                            from: debtor.name,
                            to: creditor.name,
                            amount: amountToTransfer.toFixed(2)
                        });
                        
                        creditor.balance -= amountToTransfer;
                        debtor.balance += amountToTransfer;
                    }
                    
                    if (creditor.balance === 0) i++;
                    if (debtor.balance === 0) j--;
                }
                
                // Показываем результаты
                totalSpentEl.textContent = totalSpent.toFixed(2) + ' ₽';
                averageFoodEl.textContent = foodPerPerson.toFixed(2) + ' ₽';
                averageAlcoholEl.textContent = alcoholPerDrinker.toFixed(2) + ' ₽';
                alcoholParticipantsEl.textContent = alcoholParticipants;
                
                // Очищаем и заполняем список переводов
                transfersList.innerHTML = '';
                
                if (transfers.length === 0) {
                    transfersList.innerHTML = '<div class="transfer-item">Все рассчитались поровну, переводы не нужны</div>';
                } else {
                    for (var i = 0; i < transfers.length; i++) {
                        var transfer = transfers[i];
                        var transferEl = document.createElement('div');
                        transferEl.className = 'transfer-item';
                        transferEl.innerHTML = `
                            <span><strong>${transfer.from}</strong> → <strong>${transfer.to}</strong></span>
                            <span><strong>${transfer.amount} ₽</strong></span>
                        `;
                        transfersList.appendChild(transferEl);
                    }
                }
                
                // Показываем блок с результатами
                resultsDiv.style.display = 'block';
                
                // Прокручиваем к результатам
                resultsDiv.scrollIntoView({ behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
